name: controlrrhh
services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/mongo_root
      MONGO_INITDB_DATABASE: control_rrhh
      # Workaround for MongoDB 8 on Linux kernels 6.19 through 7.0.13.
      GLIBC_TUNABLES: glibc.pthread.rseq=1
    secrets: [mongo_root, mongo_app, mongo_tools]
    volumes:
      - mongo_data:/data/db
      - ./deploy/mongo-init.js:/docker-entrypoint-initdb.d/10-controlrrhh.js:ro
      - ./deploy/mongo-health.js:/opt/mongo-health.js:ro
      - ./.deploy/backups:/backups
    networks: [private]
    healthcheck:
      test: [CMD, mongosh, --quiet, /opt/mongo-health.js]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 30s
    logging: { driver: json-file, options: { max-size: 10m, max-file: "3" } }
  facevision:
    image: controlrrhh-facevision:${APP_VERSION:?Preparar .deploy/compose.env}
    build: { context: ./deploy/facevision }
    restart: unless-stopped
    environment:
      HOME: /home/face
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
    networks: [private]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8007/health', timeout=5)"]
      interval: 20s
      timeout: 10s
      retries: 12
      start_period: 120s
    security_opt: [no-new-privileges:true]
    logging: { driver: json-file, options: { max-size: 10m, max-file: "3" } }
  app:
    image: controlrrhh-app:${APP_VERSION:?Preparar .deploy/compose.env}
    build: { context: . }
    init: true
    restart: unless-stopped
    depends_on:
      mongo: { condition: service_healthy }
      facevision: { condition: service_healthy }
    environment:
      NODE_ENV: production
      HTTP_HOST: 0.0.0.0
      MONGO_HOST: mongo
      MONGO_DB: control_rrhh
      MONGO_USER: controlrrhh
      MONGO_PASSWORD_FILE: /run/secrets/mongo_app
      BIOMETRIC_KEY_FILE: /run/secrets/biometric_key
      FACEVISION_ENABLED: "true"
      FACEVISION_URL: http://facevision:8007
      # Safe while the only published HTTP socket is bound to host loopback.
      INITIAL_SETUP_TRUST_CONTAINER_NETWORK: "true"
    secrets: [mongo_app, biometric_key]
    # Compose exige una IP literal aquí; el navegador puede abrir localhost.
    ports: ["127.0.0.1:${HTTP_PORT:-3110}:3100"]
    # La red edge permite a Docker Desktop publicar HTTP en el host. Mongo y
    # FaceVision no pertenecen a ella y permanecen aislados en private.
    networks: [private, edge]
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://localhost:3100/api/health').then(r=>r.json()).then(j=>process.exit(j.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 30s
    security_opt: [no-new-privileges:true]
    logging: { driver: json-file, options: { max-size: 10m, max-file: "3" } }
networks:
  private: { internal: true }
  edge: {}
volumes:
  mongo_data:
secrets:
  mongo_root: { file: ./.deploy/secrets/mongo-root.txt }
  mongo_app: { file: ./.deploy/secrets/mongo-app.txt }
  mongo_tools: { file: ./.deploy/secrets/mongo-tools.yml }
  biometric_key: { file: ./.deploy/secrets/biometric.key }
