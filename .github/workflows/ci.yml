name: Verificar

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'quit(db.runCommand({ ping: 1 }).ok ? 0 : 2)'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Descargar código
        uses: actions/checkout@v6
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Ejecutar pruebas
        run: npm test
      - name: Compilar frontend
        run: npm run build
      - name: Construir edición pública Docker
        run: node scripts/docker.mjs build "0.1.0-ci-${GITHUB_RUN_ID}"
      - name: Iniciar y validar edición pública Docker
        run: |
          node scripts/docker.mjs start
          node scripts/docker-smoke.mjs
      - name: Limpiar validación Docker
        if: always()
        run: docker compose --env-file .deploy/compose.env -f compose.yaml down --volumes --remove-orphans
