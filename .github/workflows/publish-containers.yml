name: Publicar app

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'quit(db.runCommand({ ping: 1 }).ok ? 0 : 2)'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v6
      - name: Validar versión semántica
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node -e "if (!/^v[0-9]+\\.[0-9]+\\.[0-9]+(?:-[0-9A-Za-z.-]+)?$/.test(process.env.RELEASE_TAG)) process.exit(1)"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Construir y validar contenedor público
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node scripts/docker.mjs build "${RELEASE_TAG#v}-verify"
          node scripts/docker.mjs start
          docker compose --env-file .deploy/compose.env -f compose.yaml exec -T \
            -e CONTROL_RRHH_URL=http://localhost:3100 app \
            node --input-type=module < scripts/docker-smoke.mjs
      - name: Limpiar validación Docker
        if: always()
        run: docker compose --env-file .deploy/compose.env -f compose.yaml down --volumes --remove-orphans

  publish:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código público
        uses: actions/checkout@v6
      - name: Preparar Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Ingresar a GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Crear etiquetas OCI
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/luiscarlosfertl-ia/control-rrhh-app
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=ControlRRHH app
            org.opencontainers.image.description=Aplicación pública de control horario con FaceVision integrado
      - name: Crear etiquetas OCI de FaceVision
        id: facevision-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/luiscarlosfertl-ia/control-rrhh-facevision
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=ControlRRHH FaceVision
            org.opencontainers.image.description=Runtime facial CPU integrado de ControlRRHH
            org.opencontainers.image.source=https://github.com/luiscarlosfertl-ia/ControlRRHH
      - name: Construir y publicar
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app
      - name: Construir y publicar FaceVision
        id: push-facevision
        uses: docker/build-push-action@v6
        with:
          context: ./deploy/facevision
          file: ./deploy/facevision/Dockerfile
          push: true
          tags: ${{ steps.facevision-meta.outputs.tags }}
          labels: ${{ steps.facevision-meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=facevision
          cache-to: type=gha,mode=max,scope=facevision
      - name: Atestar procedencia
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/luiscarlosfertl-ia/control-rrhh-app
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Atestar procedencia de FaceVision
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/luiscarlosfertl-ia/control-rrhh-facevision
          subject-digest: ${{ steps.push-facevision.outputs.digest }}
          push-to-registry: true
